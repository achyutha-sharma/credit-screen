# Keeps the deployed app from hibernating.
#
# Streamlit Community Cloud puts an app to sleep after 12 hours with no
# traffic, and the next visitor gets a "wake this app up" screen instead of the
# tool. A recruiter clicking a link at 9pm should not land on that. This pings
# the app every six hours so the idle timer never runs out.
#
# Honest caveats:
#   - This keeps a free container warm around the clock. It is a small app and
#     the load is negligible, but it is using shared free resources to avoid a
#     limit that exists on purpose. If the app ever gets real traffic, move to
#     paid hosting rather than leaning harder on this.
#   - GitHub disables scheduled workflows on repositories with no commits for
#     60 days. You will get an email; re-enable it from the Actions tab.
#   - Cron on GitHub Actions is best-effort, not exact. Runs can drift by
#     several minutes under load, which is why the interval is six hours rather
#     than eleven -- there is plenty of slack before the 12-hour timer.

name: keep-awake

on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:         # lets you trigger it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          URL="https://credit-ratios.streamlit.app"
          echo "Pinging $URL"
          # --max-time guards against a hung request holding the runner open.
          # A sleeping app answers 200 with the wake screen, which is enough to
          # reset the idle timer, so any response counts as success.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 -L "$URL" || echo "000")
          echo "HTTP $code"
          if [ "$code" = "000" ]; then
            echo "No response. The app may be down rather than asleep." >&2
            exit 1
          fi
